# Kamal deploy config for viz-quiz-bot — a Telegram quiz bot that awards VIZ
# on-chain (a startSelfAwarding loop fires the moment the bot launches, plus
# withdrawal cheques + unstaking). NO inbound HTTP — grammY bot.start() long-
# polls — so kamal-proxy is disabled (proxy: false, no top-level proxy block).
# Stateful in the shared platform MongoDB (db `quiz`, migrated from `viz-quiz`).
#
# FUNDS-MOVING + STRICT SINGLE-INSTANCE: it signs VIZ operations with the WIF key,
# and selfAward starts ON BOOT. Two instances = double awards. The .kamal/hooks/
# pre-app-boot fence (pattern from cube-worlds-bot) stops the old container before
# the new one boots — rolling redeploys are safe at the cost of ~10-30s downtime.
#
# 2026-06-10: scaffold rebased onto master (grammY rewrite, 12 commits past the
# legacy Telegraf-era 961e186 that the 2026-06-04 cutover lift-and-shifted). The
# rewrite also drops the dead viz.lexai.host public node that was crash-looping
# the legacy build (6 restarts). Build context is the repo root; the repo's
# Dockerfile (node:alpine3.11, USER node) is kept. Vestigial legacy env
# DOMAIN/PORT/CERT are dropped (unused).

service: viz-quiz-bot
image:   chiliec/viz-quiz-bot       # GHCR: composed to ghcr.io/chiliec/viz-quiz-bot via registry.server

servers:
  web:
    hosts:
      - 5.223.75.86               # axveer VPS public IPv4
    proxy: false                  # grammY long-polling bot — no inbound HTTP

# (no top-level proxy:, no ssl, no healthcheck — nothing to expose.)

ssh:
  user: deploy
  port: 666

# Shared mongo lives on platform_net; the post-deploy hook attaches platform_net
# and platform-up.sh bridges `mongo` onto the kamal network so it resolves at the
# container's mongoose.connect(process.env.MONGO) on boot. See runbook §3.2.

env:
  clear:
    ACCOUNT: quiz                 # VIZ account the bot awards from
    ADMIN_TELEGRAM_ID: "38968897" # telegram admin numeric id (not secret) — legacy .env
    BALANCE: "50000"
  secret:                         # decrypted from SOPS via .kamal/secrets
    - MONGO                       # full mongodb:// URI incl. axveer per-app creds
    - TOKEN                       # Telegram bot token
    - WIF                         # VIZ active private key — signs on-chain awards

registry:
  server: ghcr.io
  username: chiliec
  password:
    - KAMAL_REGISTRY_PASSWORD     # GHCR PAT (write:packages) — SOPS shared.enc.yaml docker_registry_password

builder:
  arch: amd64
  remote: ssh://axveer-builder   # native amd64 build on martin, not the laptop. Bare
  local: false                   # user/port fall back to ssh: above (deploy/666) +
                                 # ~/.ssh/config axveer-builder host. See infra
                                 # docs/runbook-remote-builder.md.
  args:
    BUILDKIT_INLINE_CACHE: "1"
  provenance: false
